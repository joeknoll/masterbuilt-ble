# Publishes a versioned build for the Marketplace / HACS.
#
# To release:
#   1. Set "version" in custom_components/masterbuilt_ble/manifest.json to the
#      new version (for example 0.2.0) and commit it.
#   2. Create a GitHub release with the matching tag (v0.2.0). A tag alone is
#      not enough; the Marketplace reads the latest published release.
#
# This workflow checks that the manifest version matches the tag (the
# Marketplace requires them to match), zips the integration and attaches
# masterbuilt_ble.zip to the release. hacs.json has zip_release enabled, so
# that zip is what gets installed.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the manifest version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag_version="${TAG#v}"
          manifest_version="$(jq -r .version custom_components/masterbuilt_ble/manifest.json)"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::manifest.json version ($manifest_version) does not match the release tag ($TAG). Update manifest.json, commit, and re-create the release."
            exit 1
          fi

      - name: Zip the integration
        run: |
          cd custom_components/masterbuilt_ble
          zip -r ../../masterbuilt_ble.zip . -x '__pycache__/*' '*.pyc'

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" masterbuilt_ble.zip --clobber
